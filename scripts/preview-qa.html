<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex,nofollow"><title>Verificação do preview Liora</title><style>body{margin:0;background:#e9dfc9;color:#2b2118;font:14px system-ui}form{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px;position:sticky;top:0;background:#fbf6ec;z-index:2}select,button{font:inherit;padding:8px}main{padding:20px;overflow:auto}iframe{border:1px solid #b08a47;background:#fbf6ec;width:390px;height:844px;display:block;margin:auto}output{padding:10px 16px;display:block}</style></head><body><form><label>Página <select id="route"><option value="/">Home</option><option value="/velas-aromaticas/">Catálogo</option><option value="/produtos/vela-escultural-lady-veil-phie3/">Lady Veil</option><option value="/catalogo-de-aromas/">Aromas</option><option value="/trocas-e-devolucoes.html">Trocas e devoluções</option></select></label><label>Largura <select id="width"><option>360</option><option selected>390</option><option>768</option><option>1366</option></select> px</label><button type="button" id="inspect">Medir página</button></form><output id="result" aria-live="polite">Aguardando a página</output><main><iframe id="site" title="Preview responsivo Liora" src="/"></iframe></main><script>
const frame=document.getElementById('site');
document.getElementById('route').addEventListener('change',e=>frame.src=e.target.value);
document.getElementById('width').addEventListener('change',e=>frame.style.width=e.target.value+'px');
function inspect(){const d=frame.contentDocument,w=frame.contentWindow;const excluded='.drawer,.modal,.search-ov,.mmenu,.scrim,.toast,.marquee,.hero img,.quick-add,.skip-link';const overflow=[...d.querySelectorAll('main *')].filter(el=>!el.closest(excluded)).filter(el=>{const b=el.getBoundingClientRect(),s=w.getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'&&b.width>0&&(b.left < -1||b.right>w.innerWidth+1)}).map(el=>el.tagName+'.'+el.className);document.getElementById('result').textContent=JSON.stringify({url:w.location.pathname,width:w.innerWidth,overflow:overflow.slice(0,15),h1:d.querySelector('h1')?.textContent,brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).length});}
frame.addEventListener('load',inspect);document.getElementById('inspect').addEventListener('click',inspect);
</script></body></html>
